# Runs the video transcoder and the AI ranker every 10 minutes so you don't need a laptop running on the
# wedding day. Enable by pushing the repo to GitHub and adding the three secrets
# (Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, ANTHROPIC_API_KEY
# Disable afterwards (Actions → this workflow → "…" → Disable) to stop the cron.
name: Rank photos
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run transcode
      - run: npm run rank
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
