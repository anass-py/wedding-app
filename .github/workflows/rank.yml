# Wedding-day worker in the cloud: converts new videos to a universal MP4 (and, if an
# Anthropic key is set, scores new photos for the Top 5) every ~10 minutes — no laptop needed.
#
# Switch it on:
#   1. Settings → Secrets and variables → Actions → Secrets:
#        SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY   (required)
#        ANTHROPIC_API_KEY                          (optional — enables the AI Top 5)
#   2. Same page → Variables: RANK_ENABLED = true   (set to false after the wedding)
# "Run workflow" (Actions tab) always runs once, regardless of RANK_ENABLED.
name: Wedding worker
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  worker:
    if: github.event_name == 'workflow_dispatch' || vars.RANK_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Check secrets
        run: |
          missing=""
          for v in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — add them under Settings → Secrets and variables → Actions, then re-run."
            exit 1
          fi
          [ -z "$ANTHROPIC_API_KEY" ] && echo "::notice::ANTHROPIC_API_KEY not set — videos will be converted, photos won't be AI-scored." || true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install yt-dlp (trend videos)
        run: python3 -m pip install --quiet yt-dlp curl_cffi
      - name: Convert new videos
        run: npm run transcode
      - name: Fetch new trend videos
        run: npm run trends
      - name: Score new photos (AI)
        if: env.ANTHROPIC_API_KEY != ''
        run: npm run rank
